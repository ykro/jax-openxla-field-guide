<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack OpenXLA en Google Cloud · Jerarquía de compilación</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F7F6F2;   /* warm ivory paper */
      --color-paper-2: #EFECE6;   /* warm stone secondary */
      --color-ink:     #0F2547;   /* deep navy blue */
      --color-muted:   #3B5B8C;   /* slate royal blue */
      --color-accent:  #C59216;   /* editorial rich gold */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer Stack · Serie De PyTorch a JAX y OpenXLA</p>
    <h1>De tu código en Python al silicio: dónde ocurre la aceleración real</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="openxla-stack-title openxla-stack-desc">
        <title id="openxla-stack-title">De tu código en Python al silicio: dónde ocurre la aceleración real</title>
        <desc id="openxla-stack-desc">Jerarquía de cinco capas desde modelos como Gemma y Tunix hasta GPUs NVIDIA L4 y Cloud TPUs, destacando el compilador OpenXLA y StableHLO en dorado como la capa focal de fusión y particionamiento.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(15,37,71,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#F7F6F2"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Direction column (left margin) -->
        <text x="52" y="68" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ABSTRACCIÓN</text>
        <line x1="80" y1="80" x2="80" y2="400" stroke="rgba(15,37,71,0.32)" stroke-width="1"/>
        <polygon points="76,80 84,80 80,72" fill="#3B5B8C"/>
        <polygon points="76,400 84,400 80,408" fill="#3B5B8C"/>
        <text x="56" y="424" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SILICIO</text>

        <!-- Stack container hairlines (top + bottom edges) -->
        <line x1="120" y1="80" x2="960" y2="80" stroke="rgba(15,37,71,0.16)" stroke-width="1"/>
        <line x1="120" y1="400" x2="960" y2="400" stroke="rgba(15,37,71,0.16)" stroke-width="1"/>

        <!-- L5 — Modelos y Post-entrenamiento -->
        <rect x="120" y="80" width="840" height="64" fill="#FFFFFF" stroke="rgba(15,37,71,0.12)" stroke-width="1"/>
        <text x="144" y="116" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="500">L5 · MODELOS</text>
        <text x="272" y="118" fill="#0F2547" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Gemma 2 / 3 · Tunix · Transformers</text>
        <text x="940" y="118" fill="#3B5B8C" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">LoRA, GRPO, inferencia</text>

        <!-- L4 — Frameworks de Autoría -->
        <rect x="120" y="144" width="840" height="64" fill="#F7F6F2" stroke="rgba(15,37,71,0.12)" stroke-width="1"/>
        <text x="144" y="180" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="500">L4 · AUTORÍA</text>
        <text x="272" y="182" fill="#0F2547" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Flax NNX · Keras 3 · PyTorch/XLA</text>
        <text x="940" y="182" fill="#3B5B8C" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">nnx.Module, KERAS_BACKEND, torch_xla</text>

        <!-- L3 — Transformaciones Funcionales -->
        <rect x="120" y="208" width="840" height="64" fill="#FFFFFF" stroke="rgba(15,37,71,0.12)" stroke-width="1"/>
        <text x="144" y="244" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="500">L3 · TRAZADO</text>
        <text x="272" y="246" fill="#0F2547" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Transformaciones JAX (jit, vmap, grad, scan)</text>
        <text x="940" y="246" fill="#3B5B8C" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">PyTrees puros → grafo Jaxpr</text>

        <!-- L2 — Compilador OpenXLA & StableHLO (FOCAL — DORADO) -->
        <rect x="120" y="272" width="840" height="64" fill="rgba(197,146,22,0.12)"/>
        <rect x="120" y="272" width="840" height="64" fill="none" stroke="#C59216" stroke-width="1.6"/>
        <text x="144" y="308" fill="#9A6F0B" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">L2 · COMPILADOR</text>
        <text x="272" y="310" fill="#0F2547" font-size="16" font-weight="600" font-family="'Geist', sans-serif">StableHLO + Compilador OpenXLA</text>
        <text x="940" y="310" fill="#9A6F0B" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em" font-weight="500">fusión de operadores, GSPMD sharding</text>

        <!-- L1 — Runtime PJRT & Silicio en GCP -->
        <rect x="120" y="336" width="840" height="64" fill="#EFECE6" stroke="rgba(15,37,71,0.12)" stroke-width="1"/>
        <text x="144" y="372" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="500">L1 · HARDWARE</text>
        <text x="272" y="374" fill="#0F2547" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Runtime PJRT · Cloud TPU v5e/v6e &amp; GPU NVIDIA L4</text>
        <text x="940" y="374" fill="#3B5B8C" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">tu proyecto GCP · memoria HBM / VRAM</text>

        <!-- Legend & Focal Caption Strip -->
        <rect x="120" y="442" width="12" height="12" rx="2" fill="rgba(197,146,22,0.18)" stroke="#C59216" stroke-width="1.2"/>
        <text x="140" y="452" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em" font-weight="600">CAPA FOCAL (DORADO)</text>
        <text x="272" y="452" fill="#3B5B8C" font-size="11" font-family="'Instrument Serif', serif" font-style="italic">Sin importar si escribes en JAX, Keras 3 o PyTorch/XLA, OpenXLA fusiona tus operaciones en un solo kernel antes de tocar la GPU o TPU.</text>
      </svg>
    </div>
  </div>
</body>
</html>
