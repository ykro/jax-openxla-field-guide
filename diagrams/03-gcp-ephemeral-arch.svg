<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gcp-ephemeral-arch-title gcp-ephemeral-arch-desc" id="d-03-gcp-ephemeral-arch-root">
        <title id="gcp-ephemeral-arch-title">Entrenamiento y benchmarks en GPU L4 y Cloud TPU v5e sin instancias ociosas</title>
        <desc id="gcp-ephemeral-arch-desc">Diagrama de arquitectura que conecta la validación local con instancias on-demand de Cloud TPU v5e y Vertex AI GPU L4 en Google Cloud, almacenando artefactos en Cloud Storage y sirviendo en Cloud Run con escala a cero.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-03-gcp-ephemeral-arch-root { --color-paper:   #F7F6F2;
      --color-paper-2: #EFECE6;
      --color-ink:     #0F2547;
      --color-muted:   #3B5B8C;
      --color-accent:  #C59216;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-03-gcp-ephemeral-arch-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-03-gcp-ephemeral-arch-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-03-gcp-ephemeral-arch-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="d-03-gcp-ephemeral-arch-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#0f2547" fill-opacity="0.10"/>
          </pattern>
          <marker id="d-03-gcp-ephemeral-arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3B5B8C"/></marker>
          <marker id="d-03-gcp-ephemeral-arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C59216"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#F7F6F2"/>
        <rect width="100%" height="100%" fill="url(#d-03-gcp-ephemeral-arch-dots)" opacity="0.55"/>

        <!-- Zones (drawn first) -->
        <!-- Zone 1: Entorno Local -->
        <rect x="40" y="64" width="248" height="384" rx="8" fill="#0f2547" fill-opacity="0.02" stroke="#0f2547" stroke-opacity="0.16" stroke-width="0.8"/>
        <rect x="56" y="68" width="144" height="16" rx="2" fill="#F7F6F2"/>
        <text x="128" y="79" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">1 · VALIDACIÓN LOCAL</text>

        <!-- Zone 2: Cómputo Acelerado On-Demand -->
        <rect x="336" y="64" width="328" height="384" rx="8" fill="#c59216" fill-opacity="0.04" stroke="#c59216" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="356" y="68" width="272" height="16" rx="2" fill="#F7F6F2"/>
        <text x="492" y="79" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em" font-weight="600">2 · CÓMPUTO ON-DEMAND (TU PROYECTO)</text>

        <!-- Zone 3: Persistencia y Serving Serverless -->
        <rect x="760" y="64" width="240" height="384" rx="8" fill="#0f2547" fill-opacity="0.02" stroke="#0f2547" stroke-opacity="0.16" stroke-width="0.8"/>
        <rect x="776" y="68" width="208" height="16" rx="2" fill="#F7F6F2"/>
        <text x="880" y="79" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">3 · ARTEFACTOS Y SERVING</text>

        <!-- Orthogonal Arrows (drawn before nodes) -->
        <!-- Node 1 (Local Sim) -> Node 2 (Ephemeral Runner) -->
        <line x1="164" y1="204" x2="164" y2="292" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#d-03-gcp-ephemeral-arch-arrow)"/>
        <!-- Node 2 (Runner) -> Node 3 (Cloud TPU v5e) via orthogonal elbow -->
        <path d="M 268,320 H 312 Q 320,320 320,312 V 164 Q 320,156 328,156 H 356" fill="none" stroke="#C59216" stroke-width="1.4" marker-end="url(#d-03-gcp-ephemeral-arch-arrow-accent)"/>
        <!-- Node 2 (Runner) -> Node 4 (Vertex AI L4 GPU) straight horizontal -->
        <line x1="268" y1="344" x2="356" y2="344" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#d-03-gcp-ephemeral-arch-arrow)"/>
        <!-- Node 3 (TPU v5e) -> Node 5 (Cloud Storage) straight horizontal -->
        <line x1="644" y1="156" x2="776" y2="156" stroke="#C59216" stroke-width="1.4" marker-end="url(#d-03-gcp-ephemeral-arch-arrow-accent)"/>
        <!-- Node 4 (GPU L4) -> Node 5 (Cloud Storage) orthogonal elbow -->
        <path d="M 644,344 H 704 Q 712,344 712,336 V 180 Q 712,172 720,172 H 776" fill="none" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#d-03-gcp-ephemeral-arch-arrow)"/>
        <!-- Node 5 (Cloud Storage) -> Node 6 (Cloud Run) vertical -->
        <line x1="880" y1="204" x2="880" y2="292" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-03-gcp-ephemeral-arch-arrow)"/>

        <!-- Arrow Labels -->
        <rect x="172" y="236" width="84" height="16" rx="2" fill="#F7F6F2"/>
        <text x="214" y="247" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PYTEST PASS</text>

        <rect x="672" y="132" width="80" height="16" rx="2" fill="#F7F6F2"/>
        <text x="712" y="143" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em" font-weight="600">LOGS + PESOS</text>

        <rect x="888" y="236" width="88" height="16" rx="2" fill="#F7F6F2"/>
        <text x="932" y="247" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ARTEFACTO</text>

        <!-- Nodes -->
        <!-- Node 1: Local XLA Multi-Device Sim -->
        <rect x="60" y="116" width="208" height="88" rx="6" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="76" y="140" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SIMULACIÓN LOCAL</text>
        <text x="76" y="162" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif">8 XLA Host Devices</text>
        <text x="76" y="182" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">verify_*.py + gitleaks</text>

        <!-- Node 2: Ephemeral Launcher -->
        <rect x="60" y="292" width="208" height="88" rx="6" fill="#EFECE6" stroke="#0F2547" stroke-width="1"/>
        <text x="76" y="316" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ORQUESTADOR CLI</text>
        <text x="76" y="338" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Runner con Trap EXIT</text>
        <text x="76" y="358" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">ADC auth · 0 keys en disco</text>

        <!-- Node 3 (FOCAL GOLD): Cloud TPU v5e VM -->
        <rect x="356" y="116" width="288" height="88" rx="6" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.6"/>
        <text x="376" y="140" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">FOCAL · CLOUD TPU V5E</text>
        <text x="376" y="162" fill="#0F2547" font-size="14" font-weight="600" font-family="'Geist', sans-serif">TPU VM (v5litepod-1 / v5litepod-4)</text>
        <text x="376" y="182" fill="#9A6F0B" font-size="9" font-family="'Geist Mono', monospace" font-weight="500">JAX, Flax NNX, Gemma/Tunix, PyTorch/XLA</text>

        <!-- Node 4: Vertex AI GPU L4 -->
        <rect x="356" y="292" width="288" height="88" rx="6" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="376" y="316" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VERTEX AI / GCE GPU</text>
        <text x="376" y="338" fill="#0F2547" font-size="14" font-weight="600" font-family="'Geist', sans-serif">GPU NVIDIA L4 (g2-standard-4)</text>
        <text x="376" y="358" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">Keras 3 Arena &amp; CUDA/XLA fusion</text>

        <!-- Node 5: Cloud Storage -->
        <rect x="776" y="116" width="208" height="88" rx="6" fill="#EFECE6" stroke="#3B5B8C" stroke-width="1"/>
        <text x="792" y="140" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PERSISTENCIA</text>
        <text x="792" y="162" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Cloud Storage (GCS)</text>
        <text x="792" y="182" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">métricas JSON, HLO, pesos</text>

        <!-- Node 6: Cloud Run Scale-to-Zero -->
        <rect x="776" y="292" width="208" height="88" rx="6" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="792" y="316" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SERVING SERVERLESS</text>
        <text x="792" y="338" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Cloud Run (min=0)</text>
        <text x="792" y="358" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">$0 costo en reposo</text>

        <!-- Bottom Legend Strip -->
        <line x1="40" y1="476" x2="1000" y2="476" stroke="#0f2547" stroke-opacity="0.14" stroke-width="0.8"/>
        <rect x="40" y="492" width="20" height="12" rx="2" fill="#c59216" fill-opacity="0.14" stroke="#C59216" stroke-width="1.4"/>
        <text x="68" y="502" fill="#9A6F0B" font-size="8.5" font-family="'Geist', sans-serif" font-weight="600">Ruta principal en Cloud TPU v5e (autodestrucción al terminar)</text>

        <rect x="436" y="492" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="464" y="502" fill="#3B5B8C" font-size="8.5" font-family="'Geist', sans-serif">Servicio activo / contenedor</text>

        <rect x="652" y="492" width="20" height="12" rx="2" fill="#EFECE6" stroke="#3B5B8C" stroke-width="1"/>
        <text x="680" y="502" fill="#3B5B8C" font-size="8.5" font-family="'Geist', sans-serif">Almacenamiento / CLI</text>

        <line x1="836" y1="498" x2="864" y2="498" stroke="#3B5B8C" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#d-03-gcp-ephemeral-arch-arrow)"/>
        <text x="872" y="502" fill="#3B5B8C" font-size="8.5" font-family="'Geist', sans-serif">Deploy opcional</text>
      </svg>
